name: Verify map

# Automap's CI for the public map (ADR-0033, SPEC §6.4): verifies every
# declared edge whose evidence is missing, nearing stale, or older than a
# change to its inputs, on each v1 platform; runs every seeded violation;
# signs each evidence file with GitHub artifact attestations; and commits
# the evidence and its bundles into map/evidence on main (ADR-0030).
on:
  push:
    branches: [main, ticket-15-ci-evidence]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      all:
        description: "Verify every edge, whatever its evidence"
        type: boolean
        default: false
      publish:
        description: "Commit the evidence into the map (main only)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: verify-map-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - id: plan
        run: |
          go run ./ci/cmd/verifymap plan -out matrix.json ${{ inputs.all && '-all' || '' }}
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"
          echo "jobs=$(jq '.include | length' matrix.json)" >> "$GITHUB_OUTPUT"

  verify:
    name: ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.jobs != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang pkg-config jq autoconf autoconf-archive automake libtool libltdl-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols libegl-dev \
            mesa-vulkan-drivers libvulkan1
          sudo apt-get install -y "libclang-rt-$(clang --version | sed -n 's/.*clang version \([0-9]*\).*/\1/p')-dev"
      - name: MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Ninja
        if: runner.os != 'Linux'
        run: if [ "$RUNNER_OS" = Windows ]; then choco install -y ninja; else brew install ninja; fi
      - name: vcpkg at the map's baseline
        run: |
          baseline=$(jq -r .build_backend.vcpkg.baseline map/map.json)
          # On Windows, vcpkg's git can't fetch a blobless clone's objects
          # lazily, so the clone is complete there.
          filter=--filter=blob:none
          [ "$RUNNER_OS" = Windows ] && filter=
          git clone -q $filter https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout -q "$baseline"
          if [ "$RUNNER_OS" = Windows ]; then
            cmd //c "$(cygpath -w "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat")" -disableMetrics
          else
            "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          fi
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/vcpkg-archives"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/vcpkg-archives" >> "$GITHUB_ENV"
      - name: Restore the vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/vcpkg-archives
          key: public-map-${{ runner.os }}-${{ hashFiles('map/map.json', 'map/libraries/**') }}-${{ github.run_id }}
          restore-keys: public-map-${{ runner.os }}-
      - name: Verify, run every seed, write the edges' evidence
        env:
          JOB: ${{ matrix.job }}
        run: |
          go build -o "$RUNNER_TEMP/bin/" ./cmd/automap
          go run ./ci/cmd/verifymap run -map map -job "$JOB" -automap "$RUNNER_TEMP/bin/automap" -out evidence-out
      - name: Sign the evidence
        id: attest
        if: always() && hashFiles('evidence-out/**/*.json') != ''
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: evidence-out/**/*.json
      - name: Bundle each evidence file with its signature
        if: always() && steps.attest.outcome == 'success'
        run: |
          find evidence-out -name '*.json' ! -name '*.sigstore.json' | while read -r f; do
            cp "${{ steps.attest.outputs.bundle-path }}" "${f%.json}.sigstore.json"
          done
      - uses: actions/upload-artifact@v4
        if: always() && steps.attest.outcome == 'success'
        with:
          name: evidence-${{ strategy.job-index }}
          path: evidence-out
      - name: Save the vcpkg binary cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vcpkg-archives
          key: public-map-${{ runner.os }}-${{ hashFiles('map/map.json', 'map/libraries/**') }}-${{ github.run_id }}

  publish:
    name: Commit the evidence into the map
    needs: [plan, verify]
    # Evidence from a job whose seeds failed is published too, with those
    # rules as guidance; the failed job still fails the run.
    if: always() && needs.plan.outputs.jobs != '0' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          pattern: evidence-*
          merge-multiple: true
          path: evidence-out
      - name: Commit and push
        run: |
          [ -d evidence-out/evidence ] || { echo "no evidence to publish"; exit 0; }
          cp -R evidence-out/evidence map/
          # The map must still load, evidence included.
          go run ./cmd/automap find --map map --json > /dev/null
          git config user.name "automap-ci"
          git config user.email "automap-ci@users.noreply.github.com"
          git add map/evidence
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -q -m "Evidence from Verify map run ${{ github.run_id }}"
          for attempt in 1 2 3 4; do
            git push origin HEAD:main && exit 0
            sleep $((attempt * 5))
            git pull -q --rebase origin main
          done
          exit 1
