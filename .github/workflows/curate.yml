name: Curate map

# The map's watcher and curation agents (ADR-0051): daily, the watcher
# lists upstream releases newer than the map's newest version of each
# library; for each new one without a curation branch yet, a Claude Code
# session adds it to the map, and the workflow opens a pull request
# labelled curation and starts CI and Verify map on it. The cooldown gate
# (gate.yml) decides what merges.
on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    name: Watch upstream releases
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.watch.outputs.releases }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - id: watch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          go run ./ci/cmd/watch -map map -out releases.json
          # Releases that already have a curation branch are being curated.
          git ls-remote --heads origin 'curate/*' | sed 's|.*refs/heads/curate/||' > existing.txt
          jq -c --rawfile existing existing.txt '[.[] | select(("\(.library)-\(.version)") as $b | ($existing | split("\n") | index($b)) | not)]' releases.json > new.json
          echo "releases=$(cat new.json)" >> "$GITHUB_OUTPUT"
          echo "$(jq length new.json) new releases to curate"

  curate:
    name: Curate ${{ matrix.release.library }} ${{ matrix.release.version }}
    needs: watch
    if: needs.watch.outputs.releases != '[]'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        release: ${{ fromJSON(needs.watch.outputs.releases) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      LIBRARY: ${{ matrix.release.library }}
      VERSION: ${{ matrix.release.version }}
      TAG: ${{ matrix.release.tag }}
      COMMIT: ${{ matrix.release.commit }}
      REPO: ${{ matrix.release.repo }}
      RELEASED: ${{ matrix.release.released }}
      SECURITY_FIX: ${{ matrix.release.security_fix }}
      BRANCH: curate/${{ matrix.release.library }}-${{ matrix.release.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: The release's archive hash and Claude Code
        run: |
          curl -fsSL "https://github.com/$REPO/archive/$TAG.tar.gz" -o archive.tar.gz
          echo "SHA512=$(sha512sum archive.tar.gz | cut -d' ' -f1)" >> "$GITHUB_ENV"
          rm archive.tar.gz
          npm install -g @anthropic-ai/claude-code
      - name: Curate
        # Bounded per run: at most 80 turns and this step's 40 minutes.
        timeout-minutes: 40
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          prompt=$(envsubst < ci/curation/prompt.md)
          claude -p "$prompt" --max-turns 80 --model opus --output-format json --dangerously-skip-permissions > session.json || true
          jq -r '.result // "no summary"' session.json > summary.md
          jq '{cost: .total_cost_usd, turns: .num_turns}' session.json || true
      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add map
          if git diff --cached --quiet; then
            echo "The session changed nothing:"; cat summary.md; exit 1
          fi
          go run ./cmd/automap find --map map --json > /dev/null
          git config user.name "automap-curation"
          git config user.email "automap-curation@users.noreply.github.com"
          git checkout -q -b "$BRANCH"
          git commit -q -m "Curate $LIBRARY $VERSION" -m "$(cat summary.md)"
          git push -q origin "$BRANCH"
          {
            echo "Curation of $LIBRARY $VERSION ($TAG, released $RELEASED, security fix: $SECURITY_FIX), by the Curate map workflow."
            echo
            cat summary.md
            echo
            echo "The cooldown gate merges it once it is 7 days old (a security release skips the wait) and Verify map reached probed on every platform (ADR-0037)."
            echo
            echo "---"
            echo "_Generated by [Claude Code](https://claude.ai/code)_"
          } > body.md
          gh label create curation --color 0e8a16 --description "A map change from the curation workflow" 2>/dev/null || true
          gh pr create --base main --head "$BRANCH" --title "Curate $LIBRARY $VERSION" --body-file body.md --label curation
          # Pull requests the workflow's token opens start no workflows.
          gh workflow run ci.yml --ref "$BRANCH"
          gh workflow run verify-map.yml --ref "$BRANCH"
