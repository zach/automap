name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build tools
        run: |
          sudo apt-get install -y ninja-build clang
          # clang's ThreadSanitizer runtime, for the jobs contract's sanitizer run
          sudo apt-get install -y "libclang-rt-$(clang --version | sed -n 's/.*clang version \([0-9]*\).*/\1/p')-dev"
      - name: vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
      - name: vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('testdata/map/registry/**') }}
          restore-keys: vcpkg-${{ runner.os }}-
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test
        env:
          AUTOMAP_TEST_BUILDS: "1"
        run: go test ./...

  builds:
    name: Fixture builds (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Ninja
        run: |
          if [ "$RUNNER_OS" = Windows ]; then choco install -y ninja; else brew install ninja; fi
          ninja --version
      - name: vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          if [ "$RUNNER_OS" = Windows ]; then
            cmd //c "$(cygpath -w "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat")" -disableMetrics
          else
            "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          fi
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/vcpkg-archives"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/vcpkg-archives" >> "$GITHUB_ENV"
      - name: vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('testdata/map/registry/**') }}
          restore-keys: vcpkg-${{ runner.os }}-
      - name: go test
        env:
          AUTOMAP_TEST_BUILDS: "1"
        run: go test ./... -timeout 80m

  spec-examples:
    name: Spec examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - run: python3 docs/spec/check-examples.py

  public-map:
    name: Public map (${{ matrix.name }}, ${{ matrix.group }})
    strategy:
      fail-fast: false
      matrix:
        name: [Linux, Windows, macOS]
        # The public map's compositions, in groups that each fit a job.
        group: [core, slots, media, offline]
        include:
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - group: core
            tests: TestTheTestbedStartsProbed|TestTheTestbedExtendsWithJoltProbed|TestTheTestbedExtendsWithJoltAndGLMProbed|TestTheTestbedWithDoublePrecisionJoltProbed|TestTheTestbedWithDeterministicJoltProbed
          - group: slots
            tests: TestTheTestbedExtendsWithJoltAndEnkiTSProbed|TestTheTestbedExtendsWithJoltAndMimallocProbed|TestTheTestbedExtendsWithSpdlogAndTracyProbed|TestTheTestbedExtendsWithEnkiTSTracyAndFlecsProbed
          - group: media
            tests: TestTheTestbedExtendsWithMiniaudioProbed|TestTheTestbedExtendsWithAssetLibrariesProbed|TestTheTestbedExtendsWithShadercrossProbed
          - group: offline
            tests: TestTheTestbedVerifiesOfflineAfterFetch|TestAVendoredTestbedVerifiesFromAFreshCloneOffline|TestTheReferenceCompositionsBuildWithoutAutomapOnceEjected
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang pkg-config jq autoconf autoconf-archive automake libtool libltdl-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols libegl-dev \
            mesa-vulkan-drivers libvulkan1
          sudo apt-get install -y "libclang-rt-$(clang --version | sed -n 's/.*clang version \([0-9]*\).*/\1/p')-dev"
      - name: MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Ninja
        if: runner.os != 'Linux'
        run: if [ "$RUNNER_OS" = Windows ]; then choco install -y ninja; else brew install ninja; fi
      - name: vcpkg at the map's baseline
        run: |
          baseline=$(jq -r .build_backend.vcpkg.baseline map/map.json)
          # Versioned ports, such as a curated library's pinned port
          # version, are read from vcpkg's history: clone it without blobs.
          # On Windows, vcpkg's git can't fetch a blobless clone's objects
          # lazily, so the clone is complete there.
          filter=--filter=blob:none
          [ "$RUNNER_OS" = Windows ] && filter=
          git clone -q $filter https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout -q "$baseline"
          if [ "$RUNNER_OS" = Windows ]; then
            cmd //c "$(cygpath -w "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat")" -disableMetrics
          else
            "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          fi
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/vcpkg-archives"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/vcpkg-archives" >> "$GITHUB_ENV"
      - name: Restore the vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/vcpkg-archives
          key: public-map-${{ runner.os }}-${{ matrix.group }}-${{ hashFiles('map/map.json', 'map/libraries/**') }}-${{ github.run_id }}
          restore-keys: |
            public-map-${{ runner.os }}-${{ matrix.group }}-
            public-map-${{ runner.os }}-
      - name: The public map's compositions reach probed, and every seed is caught
        env:
          AUTOMAP_TEST_PUBLIC_MAP: "1"
          AUTOMAP_TEST_BUILDS: "1"
        run: go test ./cmd/automap -run '${{ matrix.tests }}' -v -timeout 110m
      - name: Save the vcpkg binary cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vcpkg-archives
          key: public-map-${{ runner.os }}-${{ matrix.group }}-${{ hashFiles('map/map.json', 'map/libraries/**') }}-${{ github.run_id }}
